name: Validate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-equivalent:
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - name: Prepare Debian 12
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils findutils git grep jq python3 sed unzip zip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test release package
        run: bash ./scripts/build-release.sh

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: dragon-fruit-relay-${{ github.sha }}
          path: |
            dist/dragon-fruit-relay-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
