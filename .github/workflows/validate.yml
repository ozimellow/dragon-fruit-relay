name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n dragon-fruit-relay.sh
      - name: Version consistency
        run: |
          version=$(cat VERSION)
          grep -Fq "readonly RELEASE_VERSION=\"${version}\"" install.sh
          grep -Fq "readonly APP_VERSION=\"${version}\"" dragon-fruit-relay.sh
          grep -Fq "MANAGED_BY_VERSION=${version}" dragon-fruit-relay.sh
      - name: Parse SVG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('assets').glob('*.svg'):
              ET.parse(path)
              print(path)
          PY
