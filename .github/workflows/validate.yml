name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-equivalent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test release package
        run: ./scripts/build-release.sh

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: dragon-fruit-relay-${{ github.sha }}
          path: |
            dist/dragon-fruit-relay-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
