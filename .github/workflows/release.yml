name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Prepare Debian 12
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils findutils gh git grep jq python3 sed unzip zip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signed tag, version and source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          tag="${GITHUB_REF_NAME}"
          version=$(tr -d '[:space:]' < VERSION)
          base="${tag#v}"
          base="${base%%-*}"

          [[ "$base" == "$version" ]] || {
            echo "Tag $tag does not match VERSION=$version" >&2
            exit 1
          }

          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")
          type=$(jq -r '.object.type' <<<"$ref")
          [[ "$type" == "tag" ]] || {
            echo "Release tags must be signed annotated tags, not lightweight tags." >&2
            exit 1
          }

          tag_sha=$(jq -r '.object.sha' <<<"$ref")
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          [[ "$verified" == "true" ]] || {
            echo "GitHub does not report $tag as a verified signed tag." >&2
            exit 1
          }

          commit=$(git rev-list -n 1 "$tag")

          if [[ "$tag" == *-* ]]; then
            release_branch="release/${tag}"
            git fetch --no-tags origin "+refs/heads/${release_branch}:refs/remotes/origin/${release_branch}"
            branch_commit=$(git rev-parse "refs/remotes/origin/${release_branch}")
            [[ "$commit" == "$branch_commit" ]] || {
              echo "Prerelease tag $tag must point to the exact tip of ${release_branch}." >&2
              echo "tag commit:    $commit" >&2
              echo "branch commit: $branch_commit" >&2
              exit 1
            }
            echo 'prerelease=true' >> "$GITHUB_ENV"
            echo "source_branch=${release_branch}" >> "$GITHUB_ENV"
          else
            [[ "$tag" == "v${version}" ]] || {
              echo "Stable release tag must be exactly v${version}." >&2
              exit 1
            }
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            main_commit=$(git rev-parse refs/remotes/origin/main)
            [[ "$commit" == "$main_commit" ]] || {
              echo "Stable release tag $tag must point to the exact tip of main." >&2
              echo "tag commit:  $commit" >&2
              echo "main commit: $main_commit" >&2
              exit 1
            }
            echo 'prerelease=false' >> "$GITHUB_ENV"
            echo 'source_branch=main' >> "$GITHUB_ENV"
          fi

          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build and test exact release archive
        run: bash ./scripts/build-release.sh

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/dragon-fruit-relay-*.zip
            dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-fruit-relay-${{ github.ref_name }}
          path: |
            dist/dragon-fruit-relay-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            "dist/dragon-fruit-relay-${version}.zip"
            "dist/SHA256SUMS"
            --verify-tag
            --generate-notes
            --title "Dragon Fruit Relay ${GITHUB_REF_NAME}"
          )
          if [[ "$prerelease" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
