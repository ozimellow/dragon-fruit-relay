<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Dragon Fruit Relay and 3x-ui topology</title>
  <desc id="desc">Three ingress hosts use 3x-ui and Xray above Dragon Fruit Relay XFRM interfaces, connect over independent IKEv2 IPsec links to an egress hub, and forward selected traffic to an upstream network.</desc>
  <rect width="1280" height="470" rx="24" fill="#0B1220"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="58" fill="#94A3B8" font-size="18" font-weight="700" letter-spacing="2.2">INGRESS HOSTS</text>
    <text x="522" y="58" fill="#94A3B8" font-size="18" font-weight="700" letter-spacing="2.2">DRAGON FRUIT RELAY</text>
    <text x="1060" y="58" fill="#94A3B8" font-size="18" font-weight="700" letter-spacing="2.2">EGRESS</text>

    <g transform="translate(64 86)"><rect width="285" height="88" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="34" cy="29" r="9" fill="#F04F83"/><text x="55" y="34" fill="#F8FAFC" font-size="19" font-weight="700">Ingress host 01</text><text x="20" y="60" fill="#E2E8F0" font-size="13.5" font-weight="650">3x-ui + Xray · inbounds + clients</text><text x="20" y="80" fill="#94A3B8" font-size="13">routing → DFR xfrm0 source policy</text></g>
    <g transform="translate(64 191)"><rect width="285" height="88" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="34" cy="29" r="9" fill="#F04F83"/><text x="55" y="34" fill="#F8FAFC" font-size="19" font-weight="700">Ingress host 02</text><text x="20" y="60" fill="#E2E8F0" font-size="13.5" font-weight="650">3x-ui + Xray · inbounds + clients</text><text x="20" y="80" fill="#94A3B8" font-size="13">routing → DFR xfrm0 source policy</text></g>
    <g transform="translate(64 296)"><rect width="285" height="88" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/><circle cx="34" cy="29" r="9" fill="#F04F83"/><text x="55" y="34" fill="#F8FAFC" font-size="19" font-weight="700">Ingress host 03</text><text x="20" y="60" fill="#E2E8F0" font-size="13.5" font-weight="650">3x-ui + Xray · inbounds + clients</text><text x="20" y="80" fill="#94A3B8" font-size="13">routing → DFR xfrm0 source policy</text></g>

    <text x="378" y="105" fill="#94A3B8" font-size="14" font-weight="650">IKEv2 / IPsec</text>
    <path d="M349 130 C422 130 428 170 500 170" fill="none" stroke="#F04F83" stroke-width="4"/><path d="M349 235 H500" fill="none" stroke="#F04F83" stroke-width="4"/><path d="M349 340 C422 340 428 300 500 300" fill="none" stroke="#F04F83" stroke-width="4"/>
    <g fill="#F04F83"><circle cx="375" cy="133" r="5"/><circle cx="420" cy="146" r="5"/><circle cx="465" cy="164" r="5"/><circle cx="375" cy="235" r="5"/><circle cx="420" cy="235" r="5"/><circle cx="465" cy="235" r="5"/><circle cx="375" cy="337" r="5"/><circle cx="420" cy="324" r="5"/><circle cx="465" cy="306" r="5"/></g>

    <g transform="translate(500 100)">
      <rect width="410" height="270" rx="20" fill="#F8FAFC"/>
      <g transform="translate(28 24) scale(.56)"><path fill="#111827" fill-rule="evenodd" d="M18 18h53c45 0 71 23 71 62s-26 62-71 62H18V18Zm31 30v64h22c28 0 42-11 42-32S99 48 71 48H49Z"/><path fill="none" stroke="#C6265A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M59 101h18l21-24h24"/><circle cx="59" cy="101" r="9" fill="#C6265A"/><circle cx="98" cy="77" r="9" fill="#C6265A"/><circle cx="122" cy="77" r="9" fill="#C6265A"/></g>
      <text x="126" y="72" fill="#111827" font-size="25" font-weight="750">Egress hub</text><text x="126" y="97" fill="#64748B" font-size="15">one isolated profile per ingress</text>
      <line x1="28" y1="122" x2="382" y2="122" stroke="#CBD5E1" stroke-width="2"/>
      <circle cx="42" cy="153" r="6" fill="#C6265A"/><text x="60" y="159" fill="#334155" font-size="16">isolated strongSwan process</text>
      <circle cx="42" cy="188" r="6" fill="#C6265A"/><text x="60" y="194" fill="#334155" font-size="16">dedicated XFRM interface</text>
      <circle cx="42" cy="223" r="6" fill="#C6265A"/><text x="60" y="229" fill="#334155" font-size="16">per-connection forwarding + NAT</text>
    </g>

    <text x="934" y="211" fill="#94A3B8" font-size="14" font-weight="650">forward + NAT</text>
    <path d="M910 235 H1040" fill="none" stroke="#F8FAFC" stroke-width="5"/><path d="M1025 220 L1044 235 L1025 250" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1060 158)"><rect width="155" height="154" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/><path d="M40 83h75M55 64 40 83l15 19M100 64l15 19-15 19" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="127" text-anchor="middle" fill="#F8FAFC" font-size="18" font-weight="700">Network</text></g>
  </g>
</svg>
